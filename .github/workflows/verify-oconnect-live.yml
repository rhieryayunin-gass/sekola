name: O-Connect production integration verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-oconnect-live.yml
      - apps/web/scripts/verify-oconnect-live.mjs
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/verify-oconnect-live.yml
      - apps/web/scripts/verify-oconnect-live.mjs
permissions:
  contents: read
concurrency:
  group: oconnect-live-verification
  cancel-in-progress: false
jobs:
  verify:
    # A same-repository verification-only PR can exercise the deployed base.
    # Fork pull requests never receive the environment credentials.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production web, authenticated messaging, Realtime, files and cleanup
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPECTED_WEB_RELEASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: node apps/web/scripts/verify-oconnect-live.mjs

name: Trusted Learning Phase 23-26 Staging
on:
  workflow_dispatch:
    inputs:
      operation: { required: true, default: inspect, type: choice, options: [inspect, apply] }
      confirmation: { required: false, type: string }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - if: inputs.operation == 'apply'
        run: test "${{ inputs.confirmation }}" = APPLY_0028_0031
      - uses: actions/checkout@v4
        with: { repository: rhieryayunin-gass/sekola, ref: 6ae6ad6fcf5a2e20df57ada8efa3d3a28e017321 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
      - env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p .staging-db/supabase/migrations
          cp apps/api/database/migrations/*.sql .staging-db/supabase/migrations/
          supabase init --workdir .staging-db
          supabase link --workdir .staging-db --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --workdir .staging-db --linked
          supabase db push --workdir .staging-db --linked --dry-run --include-all
          if [ "${{ inputs.operation }}" = apply ]; then supabase db push --workdir .staging-db --linked --include-all; pnpm check; fi

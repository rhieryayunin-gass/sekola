name: Part 8 production verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-part7-live.yml
      - apps/web/scripts/verify-part7-live.mjs
      - apps/web/scripts/verify-part8-live.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: school-part7-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/part7-browser" playwright@1.62.1
          "$RUNNER_TEMP/part7-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify setup, learning, assessment and role isolation on the deployed release
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPECTED_WEB_RELEASE: ${{ github.sha }}
          BROWSER_MODULE: ${{ runner.temp }}/part7-browser/node_modules/playwright/index.mjs
          VERIFY_OUTPUT_DIR: ${{ runner.temp }}/part7-evidence
        run: node apps/web/scripts/verify-part7-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part8-production-verification
          path: ${{ runner.temp }}/part7-evidence
          if-no-files-found: ignore
          retention-days: 14

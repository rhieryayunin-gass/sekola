name: Package osekola API release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package the selected main commit
        run: bash ops/package-api.sh "$RUNNER_TEMP/osekola-api.tar.gz"
      - name: Store deployable API package
        uses: actions/upload-artifact@v4
        with:
          name: osekola-api-${{ github.sha }}
          path: ${{ runner.temp }}/osekola-api.tar.gz
          retention-days: 14
          if-no-files-found: error

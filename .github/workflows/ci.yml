name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migration and PostgreSQL regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: sekola_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Replay migrations, upgrade Phase 50 fixtures, and verify invariants
        env:
          DATABASE_TEST_URL: postgres://postgres:ci-local-only@localhost:5432/sekola_test
        run: bash apps/api/scripts/test-database.sh
      - name: Build PostgreSQL 17 backup tools
        run: docker build -f ops/Dockerfile.backup -t atsekola-backup:ci .
      - name: Rehearse encrypted backup and restore with restored SQL invariants
        run: >-
          docker run --rm --network host -v "$PWD:/repo:ro" -w /repo
          -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres
          -e PGPASSWORD=ci-local-only -e PGDATABASE=sekola_test
          atsekola-backup:ci bash ops/test-backup-restore.sh

  containers:
    name: Production containers and health regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify production images without live credentials
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash deploy/test-containers.sh "$RELEASE_SHA"
      - name: Validate shared VPS Nginx and systemd configuration
        run: bash deploy/test-osekola-config.sh
      - name: Verify first-install HTTP vhost and rollback in disposable Ubuntu
        run: bash deploy/test-osekola-nginx-bootstrap.sh
      - name: Verify isolated Node installer in disposable Ubuntu
        run: bash deploy/test-osekola-runtime.sh

  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check
      - name: Verify Vercel web build with public fixtures
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NEXT_PUBLIC_API_URL: https://api.osekola.com
          NEXT_PUBLIC_SUPABASE_URL: https://database.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
        run: node deploy/vercel-build.mjs
      - name: Verify native API release packaging
        run: bash ops/package-api.sh "$RUNNER_TEMP/osekola-api.tar.gz"
      - name: Verify API staging without starting a service
        run: bash deploy/test-osekola-stage.sh "$RUNNER_TEMP/osekola-api.tar.gz"
      - name: Store main API package for deployment after this CI run succeeds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: osekola-api-${{ github.sha }}
          path: |
            ${{ runner.temp }}/osekola-api.tar.gz
            ${{ runner.temp }}/osekola-api.tar.gz.sha256
            ${{ runner.temp }}/osekola-api-stage.sh
            ${{ runner.temp }}/osekola-api-release.txt
          retention-days: 14
          if-no-files-found: error

# A separate vhost inside the existing Nginx instance; no default_server.
server {
    listen 80;
    server_name api.osekola.com;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/osekola-acme; }
    location / { return 301 https://api.osekola.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.osekola.com;
    ssl_certificate /etc/letsencrypt/live/api.osekola.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.osekola.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/osekola-api.error.log warn;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
